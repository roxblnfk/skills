---

on:  # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - 'src/**'
      - 'bin/skills'
      - 'tools/psalm/**'
      - 'tools/rector/**'
      - 'resources/skills/*/scripts/**'
      - 'composer.*'
  push:
    paths:
      - 'src/**'
      - 'bin/skills'
      - 'tools/psalm/**'
      - 'tools/rector/**'
      - 'resources/skills/*/scripts/**'
      - 'composer.*'

name: 🔍 Static analysis

permissions:
  contents: read

jobs:
  psalm:
    timeout-minutes: 4
    runs-on: ${{ matrix.os }}
    concurrency:
      cancel-in-progress: true
      group: psalm-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-latest
        php-version:
          - '8.2'
        dependencies:
          - locked
    steps:
      - name: 📦 Check out the codebase
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🛠️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: 🤖 Validate composer.json and composer.lock
        run: composer validate --ansi --strict

      - name: 📥 Install "${{ matrix.dependencies }}" dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: 📥 Install vimeo/psalm
        run: composer bin psalm install --no-interaction --no-progress

      - name: 🔍 Run static analysis using vimeo/psalm
        run: composer psalm:ci

  rector:
    name: 🔙 PHP 8.1 compatibility (rector)
    timeout-minutes: 4
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Check out the codebase
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🛠️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: 📥 Install "locked" dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: locked

      - name: 📥 Install rector/rector
        run: composer bin rector install --no-interaction --no-progress

      - name: 🔍 Check for syntax newer than PHP 8.1
        run: composer rector
